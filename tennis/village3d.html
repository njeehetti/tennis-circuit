<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village 3D du circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tableau:#0e3b2c;--tableau-2:#165a43;--balle:#d9f24a;--craie:#f4f7f2;--givre:#b9d6c8;--papier:#fffdf7;--encre:#14231c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd0e8;color:var(--encre);font:15px/1.5 "Barlow",system-ui,sans-serif}
#monde{position:fixed;inset:0}
#monde canvas{display:block}
#etiquettes{position:fixed;inset:0;pointer-events:none}
/* tableau d'affichage */
.affichage{position:fixed;left:16px;right:16px;top:14px;z-index:3;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 22px;align-items:center;padding:12px 18px 12px;border-radius:16px;background:rgba(14,59,44,.94);color:var(--craie);font-family:"Barlow Condensed","Barlow",sans-serif;box-shadow:0 16px 40px -20px rgba(0,0,0,.6)}
.aff-semaine{display:flex;align-items:baseline;gap:6px;line-height:1}
.aff-semaine small{font-size:15px;color:var(--givre)}
.aff-semaine b{font-size:54px;font-weight:700;color:var(--balle);font-variant-numeric:tabular-nums}
.aff-semaine em{font-style:normal;font-size:20px;color:var(--givre)}
.aff-tournoi b{display:block;font-size:27px;font-weight:600;line-height:1.1}
.aff-tournoi span{font:14px "Barlow",sans-serif;color:var(--givre)}
.aff-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.aff-actions button,.aff-actions a{font:600 16px "Barlow Condensed",sans-serif;padding:6px 15px;border-radius:999px;border:2px solid var(--balle);background:transparent;color:var(--balle);cursor:pointer;text-decoration:none;white-space:nowrap}
.aff-actions button:hover,.aff-actions a:hover{background:rgba(217,242,74,.14)}
.aff-actions .discret{border-color:rgba(217,242,74,.35);color:var(--givre)}
#pause.actif,#noms.actif{background:var(--balle);color:var(--tableau)}
#retard{flex-basis:100%;text-align:right;font:13px "Barlow",sans-serif;color:var(--givre)}
#retard:empty{display:none}
.frise{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.case{display:flex;flex-direction:column;align-items:center;padding:4px 0 3px;border:0;border-bottom:4px solid transparent;border-radius:8px;background:rgba(255,255,255,.06);color:#6f9a86;font-family:"Barlow Condensed",sans-serif;cursor:pointer;position:relative}
.case b{font-size:17px;line-height:1.05}.case span{font-size:12px}
.case.jouee{color:var(--craie);background:rgba(255,255,255,.1)}
.case.jouee:hover{background:rgba(255,255,255,.2)}
.case.s-Hard.jouee{border-bottom-color:#5b9be0}.case.s-Clay.jouee{border-bottom-color:#e2804f}.case.s-Grass.jouee{border-bottom-color:#84c766}
.case.vue,.case.vue:hover{background:var(--balle);color:var(--tableau)}
.case:disabled{cursor:default;opacity:.5}
.case.encours::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--balle);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* bas d'écran */
.statut{position:fixed;left:16px;bottom:14px;z-index:3;display:flex;flex-direction:column;gap:6px;max-width:min(520px,calc(100% - 32px))}
.statut p{margin:0;padding:6px 12px;border-radius:999px;background:rgba(14,59,44,.88);color:var(--craie);font-size:13.5px;display:inline-flex;gap:8px;align-items:center;width:fit-content}
.point{width:9px;height:9px;border-radius:50%;background:var(--balle);animation:pulse 1.6s infinite}
.point.fini{animation:none;background:var(--givre)}.point.perdu{animation:none;background:#e63946}
#info:empty{display:none}
.aide.vue{display:none}
.aide{position:fixed;right:16px;bottom:14px;z-index:2;margin:0;padding:8px 12px;border-radius:12px;background:rgba(255,253,247,.9);font-size:13px;color:#46524c;max-width:330px}
/* étiquettes 3D */
.nom3d{font:600 13px "Barlow Condensed",sans-serif;color:#fff;background:rgba(14,59,44,.88);padding:1px 8px;border-radius:999px;white-space:nowrap;transition:background .2s,opacity .2s}
.nom3d.ia::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--balle);margin-right:5px;vertical-align:1px}
.nom3d.survol,.nom3d.choisi{background:var(--balle);color:var(--tableau)}
body:not(.avec-noms) .nom3d:not(.survol):not(.choisi),.nom3d.coach:not(.survol):not(.choisi){opacity:0}
.nom3d.coach{background:#1e4d3a}
.panneau3d{font:600 16px "Barlow Condensed",sans-serif;color:#fff;background:var(--tableau);border:1.5px solid rgba(255,255,255,.35);padding:3px 13px;border-radius:999px;white-space:nowrap}
.panneau3d span{color:var(--balle);font-weight:500;margin-left:7px}
.bulle3d{max-width:270px;background:#fff;color:var(--encre);border:2px solid var(--tableau);border-radius:14px;padding:7px 11px;font-size:13.5px;line-height:1.4;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.bulle3d b{display:block;font:600 15px "Barlow Condensed",sans-serif;color:var(--tableau-2)}
/* fiche */
#fiche{position:fixed;right:16px;top:178px;bottom:16px;width:350px;max-width:calc(100% - 32px);z-index:4;overflow-y:auto;background:var(--papier);border-radius:16px;border-top:12px solid var(--couleur,#0e3b2c);padding:0 16px 14px;font-size:14px;box-shadow:0 24px 54px -18px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.3,.7,.2,1)}
#fiche[hidden]{display:block;transform:translateX(calc(100% + 40px));visibility:hidden}
#fiche .fiche-tete{display:flex;justify-content:space-between;align-items:center;margin:10px 30px 2px 0;font-family:"Barlow Condensed",sans-serif}
#fiche .pays{font-size:16px;font-weight:700;color:#5d6b64}
#fiche .pilote{font-size:14px;font-weight:600;padding:1px 10px;border-radius:999px;background:#e8ece9;color:#46524c}
#fiche .pilote.ia{background:var(--balle);color:var(--tableau)}
#fiche h3{font:700 30px/1.05 "Barlow Condensed",sans-serif;margin:0}
#fiche .perso-txt{margin:4px 0 10px;color:#56635c;font-size:13.5px}
#fiche .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px;margin:0 0 10px}
#fiche .stat{background:var(--tableau);border-radius:10px;padding:6px 6px 5px;text-align:center}
#fiche .stat b{display:block;font:700 23px/1.1 "Barlow Condensed",sans-serif;color:var(--balle);font-variant-numeric:tabular-nums}
#fiche .stat span{font-size:11.5px;color:var(--givre)}
#fiche .fatigue{margin:0 0 8px;font-size:13px;color:#56635c;background:linear-gradient(#e3e8e5,#e3e8e5) left bottom/100% 7px no-repeat}
#fiche .fatigue i{display:block;height:7px;border-radius:4px;margin-top:3px}
#fiche .kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e6e9e4;padding:5px 0;font-size:13.5px}
#fiche .kv span{color:#6a766f}#fiche .kv b{text-align:right;font-weight:600}
#fiche blockquote{margin:8px 0 0;padding:8px 10px;background:#eef3ec;border-radius:10px;font-size:13.5px;line-height:1.45}
#fiche blockquote span{display:block;font:600 14px "Barlow Condensed",sans-serif;color:var(--tableau-2)}
#fiche .fermer{position:absolute;right:6px;top:8px;border:0;background:none;font-size:24px;line-height:1;color:#56635c;padding:2px 8px;cursor:pointer}
/* chargement / erreur */
#voile{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--tableau);color:var(--craie);font:600 26px "Barlow Condensed",sans-serif;text-align:center;transition:opacity .6s;padding:16px}
#voile.parti{opacity:0;pointer-events:none}
#voile small{display:block;font:15px "Barlow",sans-serif;color:var(--givre);margin-top:8px}
#voile a{color:var(--balle)}
@media (max-width:820px){.affichage{grid-template-columns:auto minmax(0,1fr);left:8px;right:8px;top:8px}.aff-actions{grid-column:1/-1;justify-content:flex-start}
  .frise{grid-template-columns:repeat(6,minmax(0,1fr))}.aff-semaine b{font-size:40px}.aff-tournoi b{font-size:21px}
  #fiche{top:auto;height:55%;left:8px;right:8px;width:auto;bottom:8px}.aide{display:none}}
@media (prefers-reduced-motion: reduce){.case.encours::after,.point{animation:none}#fiche{transition:none}}
</style>
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body class="avec-noms">
<div id="monde" role="img" aria-label="Village 3D du circuit : un personnage par agent. Clique sur un personnage pour ouvrir sa fiche."></div>
<div id="etiquettes"></div>

<header class="affichage">
  <div class="aff-semaine"><small>Semaine</small><b id="num">–</b><em id="total"></em></div>
  <div class="aff-tournoi"><b id="tournoi">Connexion…</b><span id="detail"></span></div>
  <div class="aff-actions">
    <button id="pause" type="button" aria-pressed="false">⏸ Pause</button>
    <button id="direct-btn" type="button" hidden>Revenir au direct</button>
    <button id="vue" type="button" class="discret">Vue d'ensemble</button>
    <button id="noms" type="button" class="discret actif" aria-pressed="true">Noms</button>
    <a href="/" class="discret">Plan 2D</a>
    <span id="retard"></span>
  </div>
  <div class="frise" id="frise" role="group" aria-label="Choisir la semaine affichée"></div>
</header>

<aside id="fiche" hidden aria-live="polite"></aside>

<div class="statut">
  <p><span class="point" id="point"></span><span id="statut">connexion…</span></p>
  <p id="info"></p>
</div>
<p class="aide">Glisser pour tourner, molette pour zoomer, clic droit pour se déplacer. Balle jaune au-dessus de la tête : joueur piloté par l'IA. Même maillot : jumeaux statistiques.</p>

<div id="voile">Construction du village…<small>chargement de la 3D</small></div>

<script type="module" src="/village3d.js"></script>
</body>
</html>
